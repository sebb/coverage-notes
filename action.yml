name: 'Coverage Notes'
description: 'Track and compare PHPUnit Clover code coverage evolution using Git notes without third-party services.'
author: 'sebb'

branding:
  icon: 'trending-up'
  color: 'green'

inputs:
  mode:
    description: 'Execution mode: "auto" (compare on all events, record on base branch pushes), "compare", or "record"'
    required: false
    default: 'auto'
  clover-file:
    description: 'Path to the Clover XML file generated by PHPUnit'
    required: false
    default: 'coverage.xml'
  base-branch:
    description: 'Base branch name to compare against and record notes on in auto mode'
    required: false
    default: 'main'
  strategy:
    description: 'Baseline resolution strategy: "merge-base" or "direct"'
    required: false
    default: 'merge-base'
  fail-under:
    description: 'Minimum required overall coverage percentage (optional)'
    required: false
    default: ''
  max-drop:
    description: 'Maximum allowed coverage drop percentage compared to baseline (optional)'
    required: false
    default: ''
  ref:
    description: 'Git notes ref namespace (e.g. "coverage" for refs/notes/coverage)'
    required: false
    default: 'coverage'
  remote:
    description: 'Git remote name'
    required: false
    default: 'origin'
  push:
    description: 'Push the recorded Git note back to the remote repository ("true" or "false")'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install coverage-notes dependencies
      shell: bash
      run: |
        if [ ! -f "$GITHUB_ACTION_PATH/vendor/autoload.php" ]; then
          composer install \
            --working-dir="$GITHUB_ACTION_PATH" \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader
        fi

    - name: Compare coverage against baseline
      if: ${{ inputs.mode == 'auto' || inputs.mode == 'compare' }}
      shell: bash
      env:
        CLOVER_FILE: ${{ inputs.clover-file }}
        BASE_REF: ${{ inputs.remote }}/${{ inputs.base-branch }}
        STRATEGY: ${{ inputs.strategy }}
        NOTES_REF: ${{ inputs.ref }}
        REMOTE: ${{ inputs.remote }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        MAX_DROP: ${{ inputs.max-drop }}
      run: |
        ARGS=(
          --base="$BASE_REF"
          --strategy="$STRATEGY"
          --ref="$NOTES_REF"
          --remote="$REMOTE"
        )

        "$GITHUB_ACTION_PATH/bin/coverage-notes" compare "$CLOVER_FILE" "${ARGS[@]}" --format=markdown >> "$GITHUB_STEP_SUMMARY"

        if [ -n "$FAIL_UNDER" ]; then
          ARGS+=(--fail-under="$FAIL_UNDER")
        fi

        if [ -n "$MAX_DROP" ]; then
          ARGS+=(--max-drop="$MAX_DROP")
        fi

        "$GITHUB_ACTION_PATH/bin/coverage-notes" compare "$CLOVER_FILE" "${ARGS[@]}" --format=console

    - name: Record coverage note
      if: ${{ inputs.mode == 'record' || (inputs.mode == 'auto' && github.event_name == 'push' && github.ref_name == inputs.base-branch) }}
      shell: bash
      env:
        CLOVER_FILE: ${{ inputs.clover-file }}
        NOTES_REF: ${{ inputs.ref }}
        REMOTE: ${{ inputs.remote }}
        PUSH_NOTES: ${{ inputs.push }}
      run: |
        if [ -z "$(git config user.name || true)" ]; then
          git config user.name "github-actions[bot]"
        fi
        if [ -z "$(git config user.email || true)" ]; then
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        fi

        ARGS=(
          --ref="$NOTES_REF"
          --remote="$REMOTE"
        )

        if [ "$PUSH_NOTES" = "true" ]; then
          ARGS+=(--push)
        fi

        "$GITHUB_ACTION_PATH/bin/coverage-notes" record "$CLOVER_FILE" "${ARGS[@]}"
